order:2px solid white;border-radius:12px;padding:1.3% 2%;width:55%;box-shadow:0 4px 12px #7775;font-size:clamp(9px,1.1vw,16px)}.event strong{color:#7656a4;font-size:1.25em}.event p{margin:3px 0}.event button{color:#6170a5;background:transparent;text-decoration:underline;padding:0}.showcase{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}.showcase .art{height:95%;width:70%;border-radius:40% 40% 15% 15%;background:radial-gradient(circle at 50% 34%,#fff9 0 12%,transparent 40%),linear-gradient(145deg,#a6b0ed,#e7b2d8);border:5px solid #ffffff99;box-shadow:0 0 35px #fff8;display:flex;align-items:center;justify-content:center;overflow:hidden}.showcase .art img{width:100%;height:100%;object-fit:contain}.placeholder{text-align:center;color:#fff;text-shadow:0 2px 8px #626b9d;font-weight:900;font-size:clamp(14px,2.5vw,35px)}.placeholder .spark{font-size:2.5em}.showcase .label{position:absolute;bottom:5%;left:6%;color:white;text-shadow:0 3px 8px #555;font-weight:1000;font-size:clamp(12px,2vw,28px)}.actions{display:flex;align-items:center;justify-content:flex-end;gap:2%;height:20%;z-index:2}.pull{height:74%;min-width:23%;padding:0 3%;border-radius:13px;border:3px solid white;color:#485b7c;background:linear-gradient(#fff,#d6e7f6);box-shadow:0 5px 0 #8ea4c0;font-weight:1000;font-size:clamp(11px,1.5vw,21px)}.pull.ten{background:linear-gradient(#ffeab0,#ffbd76);box-shadow:0 5px 0 #c78c6e;color:#795139}.pull small{display:block;font-size:.7em}.nav{display:flex;gap:7px}.nav button{background:#6576ae;color:white;border-radius:10px;padding:8px 14px;font-weight:bold;font-size:clamp(9px,1vw,15px)}.overlay{position:absolute;inset:0;background:#14152bdc;z-index:10;display:none;align-items:center;justify-content:center;padding:3%}.overlay.visible{display:flex}.panel{width:min(85%,850px);max-height:94%;overflow:auto;background:#fffafc;border:4px solid #fff;border-radius:20px;box-shadow:0 12px 50px #0007;padding:2%;position:relative}.panel h2{margin:0 0 1.5%;color:#6771aa;font-size:clamp(16px,2vw,26px)}.close{position:absolute;right:2%;top:2%;border-radius:100%;background:#e8e9f3;color:#59617d;font-weight:900;width:34px;height:34px}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button,.soft{border-radius:10px;background:#e8e9f7;padding:8px 14px;font-weight:800;color:#5d6998}.tabs button.active{background:#7583bb;color:white}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item{background:white;border:2px solid #e7e5f0;border-radius:12px;padding:9px;text-align:center;font-size:clamp(9px,1.05vw,14px)}.item .pic{height:75px;background:linear-gradient(140deg,#c8d3f6,#f2d4e9);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;font-size:30px}.item .pic img{width:100%;height:100%;object-fit:contain}.item b{display:block;margin:5px 0}.item button{background:#ffdb88;color:#6a5475;border-radius:8px;padding:7px;font-weight:bold;width:100%}.item button:disabled{opacity:.4;cursor:default}.stars{color:#e5a845;letter-spacing:2px}.muted{font-size:12px;color:#78809c}.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.shop-card{background:#eef5ff;border-radius:12px;padding:14px;text-align:center}.shop-card strong{font-size:22px;color:#3cabc9}.shop-card button,.primary{background:#ffcc7c;color:#6b4e5a;border:2px solid white;border-radius:12px;padding:10px 20px;font-weight:1000;box-shadow:0 3px 0 #d4a86e}.result-screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center}.result-screen .quote{font-size:clamp(18px,2.5vw,34px);line-height:1.7;text-shadow:0 2px 9px #000;max-width:85%}.result-screen .result-card{width:min(75%,750px);height:70%;border:5px solid #ffdd8e;border-radius:16px;background:linear-gradient(135deg,#9baddb,#e5bad4);position:relative;overflow:hidden;box-shadow:0 0 55px #ffe5a8aa}.result-card img{width:100%;height:100%;object-fit:contain}.result-card .card-footer{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#182039e8);color:white;text-align:left;padding:9% 4% 3%}.result-card .card-footer h2{margin:0;font-size:clamp(17px,2.6vw,36px)}.result-card .card-footer p{margin:3px 0}.result-actions{display:flex;gap:12px;margin-top:12px}.result-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:95%;margin:auto}.result-grid .item{color:#344}.result-grid .pic{height:60px}.admin input,.admin select{width:100%;padding:7px;border:1px solid #b8bed2;border-radius:7px}.admin label{display:block;font-size:12px;font-weight:bold;margin:8px 0}.admin .fields{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}.notice{background:#f1f4ff;border-radius:9px;padding:10px;margin:10px 0;font-size:12px}@media(max-width:650px){.nav button{padding:5px}.panel{width:96%}.item .pic{height:45px}.items{gap:4px}.shop-card{padding:5px}.shop-card strong{font-size:13px}.shop-card button{padding:5px;font-size:10px}.event{width:60%}}

ight:1000;letter-spacing:.14em;text-shadow:0 3px 12px #5f92b6;animation:pulse 1.2s ease-in-out infinite}.skip-top{position:absolute;right:3%;top:5%;z-index:5;background:#fffd;color:#55617c;border-radius:12px;padding:9px 18px;font-weight:900;box-shadow:0 4px 8px #0003}.special-three{background:radial-gradient(circle,#fff 0%,#ce9bfa 34%,#6a64d6 100%)}.special-four{background:radial-gradient(circle,#fff9dc 0%,#ffc86b 32%,#ef79b2 68%,#7159c9 100%)}.special-two{background:radial-gradient(circle,#c7ffff,#62c4ef)}.special .burst{position:relative;font-size:clamp(70px,14vw,200px);animation:pop .8s ease-in-out infinite alternate;text-shadow:0 0 45px #fff}.special h2,.special p{position:relative;text-shadow:0 3px 12px #57618b}.quote-stage{background:radial-gradient(circle,#a690cf,#222244)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-12px) scale(1.08)}}@keyframes pulse{50%{opacity:.5}}@keyframes pop{to{transform:scale(1.2) rotate(9deg)}}

.event{position:relative}.event-logo{display:none!important}.event-floating-logo{position:absolute;z-index:4;right:1%;top:13%;width:53%;height:21%;object-fit:contain;object-position:right center;filter:drop-shadow(0 3px 3px #fff) drop-shadow(0 4px 6px #51487988);pointer-events:none}.event.has-image{margin-top:19%;width:51%}.showcase .label{display:none}.result-screen.full-reveal{position:absolute;inset:0;cursor:pointer;overflow:hidden;background:linear-gradient(130deg,#485eaa,#d7a7dc);display:block}.full-reveal .result-card{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;box-shadow:none}.full-reveal .result-card .card-footer{padding:8% 4% 3%;pointer-events:none}.full-reveal .result-card .crop-art{position:absolute;inset:0}.full-reveal .result-card img{object-fit:contain}.skip-corner{position:absolute;bottom:2%;right:2%;z-index:15;border-radius:9px;background:#ffffffdf;color:#4c547b;padding:9px 16px;font-weight:900;box-shadow:0 3px 9px #0005}.star-sequence{display:flex;gap:1vw;justify-content:center;position:absolute;left:3%;top:4%;z-index:5}.star-sequence span{font-size:clamp(20px,4vw,55px);color:#ffcf51;text-shadow:0 2px 2px #a56732,0 0 13px #fff;opacity:0;animation:starIn .36s cubic-bezier(.15,1.6,.4,1) forwards;animation-delay:calc(var(--i)*.24s)}@keyframes starIn{from{opacity:0;transform:scale(3.2)}to{opacity:1;transform:scale(1)}}.collection-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.collection-toolbar select{padding:8px;border:1px solid #ccd1e0;border-radius:9px}.collection-card{cursor:pointer}.collection-card:hover{outline:2px solid #8c91d1}.detail-full{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(130deg,#6674b6,#c7b4df);color:white}.detail-full .result-card{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0}.featured-checks{max-height:150px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px}.featured-checks label{margin:0;display:flex;align-items:center;gap:5px;background:#edf0fa;padding:6px;border-radius:6px}.featured-checks input{width:auto}.summon-screen.special:before{animation-duration:2s}.summon-screen.special-four:after,.summon-screen.special-three:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 30deg,transparent 0 15deg,#ffffff65 18deg 19deg,transparent 23deg 35deg);animation:spin 5s linear infinite;mix-blend-mode:screen}.special-four .burst{filter:drop-shadow(0 0 25px #fff);animation:pop .5s ease-in-out infinite alternate}.special-three .burst{filter:drop-shadow(0 0 10px #fff)}
</style></head><body><div id="screen"><header class="top"><div class="logo">✦ MAG GACHA <span style="font-size:.45em;color:#8993b6">PROTOTYPE</span></div><div class="nav"><button onclick="openPanel('collection')">カード図鑑</button><button onclick="openPanel('exchange')">交換所</button><button onclick="openPanel('shop')">ショップ</button><button onclick="openPanel('admin')">カード登録</button></div><div class="currency"><span class="gem">◆</span><span id="balance">0</span></div></header><main class="main"><aside class="sidebar"><h3>GACHA SELECT</h3><button class="banner active" onclick="selectGacha(0)">✦ 星降る夜の約束<small>★★★★ ピックアップ</small></button><button class="banner" onclick="selectGacha(1)">✿ 休日の寄り道<small>★★★ ピックアップ</small></button><button class="banner" onclick="selectGacha(2)">◇ スタンダード<small>いつでも開催</small></button></aside><section class="content"><div class="event"><strong id="eventTitle">星降る夜の約束</strong><p id="eventInfo">★★★★のピックアップ確率UP！</p><button onclick="openPanel('rates')">提供割合・ピックアップ詳細を見る ›</button></div><div class="showcase"><div class="art" id="showArt"><div class="placeholder"><div class="spark">✧ ✦ ✧</div>YOUR CHARACTER<br><span style="font-size:.48em">イラスト登録でここに表示</span></div></div><div class="label" id="showLabel">星降る夜の約束</div></div><div class="actions"><button class="pull" onclick="startPull(1)">1回引く<small>◆ 10</small></button><button class="pull ten" onclick="startPull(10)">10回引く<small>◆ 100 ／ ★★★以上1枚確定</small></button></div></section></main><div id="overlay" class="overlay"><div id="modal" class="panel"></div></div></div><script>
const KEY='mag_gacha_v1';const defaults=[{id:'c01',name:'キャラA',title:'いつもの日常',rarity:2,quote:'',image:''},{id:'c02',name:'キャラB',title:'穏やかな午後',rarity:2,quote:'',image:''},{id:'c03',name:'キャラC',title:'はじめまして',rarity:2,quote:'',image:''},{id:'c04',name:'キャラA',title:'休日のお出かけ',rarity:3,quote:'',image:''},{id:'c05',name:'キャラB',title:'お祭りの夜',rarity:3,quote:'',image:''},{id:'c06',name:'キャラC',title:'特別な衣装',rarity:3,quote:'',image:''},{id:'c07',name:'キャラA',title:'星降る夜の約束',rarity:4,quote:'「やっと、ここまで来られたね。」',image:''},{id:'c08',name:'キャラB',title:'譲れない信念',rarity:4,quote:'「ここから先は、私に任せて。」',image:''},{id:'c09',name:'キャラC',title:'忘れられない景色',rarity:4,quote:'「この瞬間を、ずっと覚えていたい。」',image:''}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};if(!state)state={balance:0,cards:defaults,owned:{},tickets:{2:0,3:0,4:0},history:[]};let gacha=0,tabR=2,results=[],resultIndex=0,phase='';const names=['星降る夜の約束','休日の寄り道','スタンダード'];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存容量が足りない可能性があるぞ。画像を小さくして試してみて！')}};const el=id=>document.getElementById(id);const stars=r=>'★'.repeat(r);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function sync(){el('balance').textContent=state.balance.toLocaleString()}sync();function selectGacha(n){gacha=n;document.querySelectorAll('.banner').forEach((b,i)=>b.classList.toggle('active',i===n));el('eventTitle').textContent=names[n];el('eventInfo').textContent=n===0?'★★★★のピックアップ確率UP！':n===1?'★★★のピックアップ確率UP！':'全カードが対象の常設ガチャ';el('showLabel').textContent=names[n];const card=state.cards.find(c=>c.id===(n===0?'c07':n===1?'c04':'c01'))||state.cards[0];el('showArt').innerHTML=card?.image?`<img src="${card.image}" alt="">`:'<div class="placeholder"><div class="spark">✧ ✦ ✧</div>YOUR CHARACTER<br><span style="font-size:.48em">イラスト登録でここに表示</span></div>'}function modal(html){el('modal').innerHTML=html+'<button class="close" onclick="closePanel()">×</button>';el('overlay').classList.add('visible')}function closePanel(){el('overlay').classList.remove('visible')}function openPanel(which){if(which==='shop')return renderShop();if(which==='collection')return renderCollection();if(which==='exchange')return renderExchange();if(which==='admin')return renderAdmin();if(which==='rates')return modal(`<h2>提供割合</h2><p>★★ 75% ／ ★★★ 22% ／ ★★★★ 3%</p><p>10連は★★★以上が最低1枚確定。</p><p>ピックアップガチャでは同じレアリティ内で対象カードの抽選重みが高くなる。レアリティ全体の排出率は変わらない。</p><p class="notice">現在の対象カード：${esc(gacha===0?'星降る夜の約束':gacha===1?'休日のお出かけ':'全カード')}</p>`)}function renderShop(){modal(`<h2>◆ 通貨ショップ</h2><p>すべて無料！ でも購入の気分は本物。</p><div class="shop-grid">${[10,50,100,1000].map(n=>`<div class="shop-card"><div style="font-size:30px;color:#31b7d1">◆</div><strong>${n.toLocaleString()}個</strong><p class="muted">価格：無料</p><button onclick="buy(${n})">購入する</button></div>`).join('')}</div><p class="notice">所持通貨：◆ ${state.balance.toLocaleString()}　／　1回10個・10回100個</p>`)}function buy(n){if(!confirm(`◆ ${n}個を無料で購入する？`))return;state.balance+=n;save();sync();renderShop();alert(`購入完了！ ◆ ${n}個を受け取った！`)}function pickR(min=2){let rates=min===3?[[3,22],[4,3]]:[[2,75],[3,22],[4,3]];let total=rates.reduce((a,b)=>a+b[1],0),x=Math.random()*total;for(const [r,w] of rates){x-=w;if(x<0)return r}return 4}function pickCard(r){let pool=state.cards.filter(c=>c.rarity===r);if(!pool.length)return null;let weights=pool.map(c=>gacha===0&&c.id==='c07'||gacha===1&&c.id==='c04'?5:1);let x=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){x-=weights[i];if(x<0)return pool[i]}return pool[0]}function startPull(n){if(state.balance<n*10){if(confirm('通貨が足りない！ ショップへ行く？'))renderShop();return}if(!confirm(`${n}回ガチャを引く？ ◆ ${n*10}個消費するぞ。`))return;state.balance-=n*10;results=[];for(let i=0;i<n;i++){let r=pickR(n===10&&i===9?3:2),c=pickCard(r);if(!c){c=state.cards[Math.floor(Math.random()*state.cards.length)]}if(!c)continue;const duplicate=!!state.owned[c.id];if(duplicate)state.tickets[c.rarity]=(state.tickets[c.rarity]||0)+1;else state.owned[c.id]=1;results.push({...c,duplicate});state.history.unshift({id:c.id,date:Date.now(),duplicate})}save();sync();resultIndex=0;phase='quote';showResult()}function resultCard(c){return `<div class="result-card">${c.image?`<img src="${c.image}" alt="">`:'<div class="placeholder" style="padding-top:10%"><div class="spark">✦</div>CHARACTER ART</div>'}<div class="card-footer"><div class="stars">${stars(c.rarity)}</div><p>${esc(c.title)}</p><h2>${esc(c.name)}</h2>${c.duplicate?'<small>重複 → 同レアリティのチケット +1</small>':'<small>NEW!</small>'}</div></div>`}function showResult(){let c=results[resultIndex];if(!c)return;if(c.rarity===4&&phase==='quote'){el('overlay').classList.add('visible');el('modal').outerHTML;el('overlay').innerHTML=`<div class="result-screen"><div class="stars" style="font-size:30px">★★★★</div><div class="quote">${esc(c.quote||'「…………！」')}</div><button class="primary" onclick="phase='card';showResult()">タップして登場 ▶</button></div>`;return}el('overlay').innerHTML=`<div class="result-screen">${resultCard(c)}<div class="result-actions"><button class="primary" onclick="nextResult()">${resultIndex===results.length-1?'結果一覧へ':'次のカードへ ▶'}</button><button class="soft" onclick="finishPull()">スキップ</button></div><div class="muted" style="color:white">${resultIndex+1} / ${results.length}</div></div>`;el('overlay').classList.add('visible')}function nextResult(){resultIndex++;if(resultIndex>=results.length)return finishPull();phase='quote';showResult()}function finishPull(){el('overlay').innerHTML=`<div class="panel" style="width:92%"><h2>ガチャ結果</h2><div class="result-grid">${results.map(c=>`<div class="item"><div class="pic">${c.image?`<img src="${c.image}">`:'✦'}</div><div class="stars">${stars(c.rarity)}</div><b>${esc(c.name)}</b><small>${esc(c.title)}</small><p>${c.duplicate?'チケット +1':'NEW!'}</p></div>`).join('')}</div><p style="text-align:center"><button class="primary" onclick="resetOverlay()">閉じる</button></p></div>`}function resetOverlay(){el('ove nput id="aImg" type="file" accept="image/*"></label></div><label>登場セリフ<input id="aQuote" placeholder="★★★★の演出で表示"></label><div id="drop" style="padding:15px;border:2px dashed #aab7d4;text-align:center;border-radius:10px">ここに画像をドロップしてもOK</div><p><button class="primary" onclick="addCard()">カードを追加</button> <button class="soft" onclick="exportData()">JSONを書き出す</button> <button class="soft" onclick="el('importFile').click()">JSONを読み込む</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(this.files[0])"></p><p class="notice">登録済み：${state.cards.length}枚。画像を含むデータはこのブラウザ内で保存。別の端末への移動にはJSONの書き出し・読み込みを使ってね。</p></div>`);let drop=el('drop');drop.ondragover=e=>{e.preventDefault();drop.style.background='#dce8ff'};drop.ondragleave=()=>drop.style.background='';drop.ondrop=e=>{e.preventDefault();drop.style.background='';if(e.dataTransfer.files[0]){let dt=new DataTransfer();dt.items.add(e.dataTransfer.files[0]);el('aImg').files=dt.files;drop.textContent=e.dataTransfer.files[0].name}}}async function addCard(){let name=el('aName').value.trim(),title=el('aTitle').value.trim(),rarity=+el('aR').value,quote=el('aQuote').value.trim(),file=el('aImg').files[0];if(!name||!title){alert('キャラ名とカード名を入力してね');return}let image='';if(file){image=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}let id='custom_'+Date.now();state.cards.push({id,name,title,rarity,quote,image});save();selectGacha(gacha);renderAdmin();alert('カードを登録したぞ！')}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mag-gacha-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}async function importData(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.cards)||typeof data.balance!=='number')throw Error();if(!confi function resetProgress(){if(!confirm('通貨・所持カード・チケット・履歴をリセットする？'))return;state.balance=0;state.owned={};state.tickets={2:0,3:0,4:0};state.history=[];save();sync();renderSettings();alert('プレイデータをリセットしたぞ')}
const oldImport=importData;importData=async function(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.cards)||typeof data.balance!=='number')throw Error('形式が違う');if(!confirm('現在のデータをバックアップで置き換える？'))return;state=data;ensureV2();save();sync();selectGacha(0);renderAdmin()}catch(e){alert('JSONを読み込めなかった：'+e.message)}};
function startPull(n){if(state.balance<n*10){if(confirm('通貨が足りない！ ショップへ行く？'))renderShop();return}if(!confirm(`${n}回ガチャを引く？ ◆ ${n*10}個消費するぞ。`))return;state.balance-=n*10;results=[];const newly=new Set(Object.keys(state.owned).filter(k=>state.owned[k]));for(let i=0;i<n;i++){let r=pickR(n===10&&i===9?3:2),c=pickCard(r);if(!c)c=state.cards[Math.floor(Math.random()*state.cards.length)];if(!c)continue;const duplicate=newly.has(c.id);if(duplicate)state.tickets[c.rarity]=(state.tickets[c.rarity]||0)+1;else{state.owned[c.id]=1;newly.add(c.id)}results.push({...c,duplicate});state.history.unshift({id:c.id,date:Date.now(),duplicate})}save();sync();resultIndex=0;phase='tap';showSummon()}
function showSummon(){const max=Math.max(2,...results.map(c=>c.rarity));el('overlay').innerHTML=`<div class="summon-screen" onclick="revealSummon()"><button class="skip-top" onclick="event.stopPropagation();skipResults()">SKIP ≫</button><div class="summon-orb ${max===4?'orb-four':max===3?'orb-three':''}">✦</div><div class="tap-text">TAP TO START</div><p class="muted" style="color:white">画面をタップして召喚</p></div>`;el('overlay').classList.add('visible')}
function revealSummon(){let max=Math.max(2,...results.map(c=>c.rarity));el('overlay').innerHTML=`<div class="summon-screen special ${max===4?'special-four':max===3?'special-three':'special-two'}" onclick="resultIndex=0;phase='quote';showResult()"><button class="skip-top" onclick="event.stopPropagation();skipResults()">SKIP ≫</button><div class="burst">${max===4?'✦ ✧ ✦':max===3?'✧ ✦ ✧':'✧'}</div><h2>${max===4?'★★★★ SPECIAL!':max===3?'★★★ RARE!':'SUMMON!'}</h2><p>TAP TO CONTINUE</p></div>`}
function resultCard(c){return `<div class="result-card">${artTag(c)}<div class="card-footer"><div class="stars">${stars(c.rarity)}</div><p>${esc(c.title)}</p><h2>${esc(c.name)}</h2>${c.duplicate?'<small>重複 → チケット +1</small>':'<small>NEW!</small>'}</div></div>`}
function showResult(){let c=results[resultIndex];if(!c)return finishPull();if(c.rarity===4&&phase==='quote'){el('overlay').innerHTML=`<div class="result-screen quote-stage"><button class="skip-top" onclick="skipResults()">SKIP ≫</button><div class="stars" style="font-size:30px">★★★★</div><div class="quote">${esc(c.quote||'「…………！」')}</div><button class="primary" onclick="phase='card';showResult()">タップして登場 ▶</button></div>`;return}el('overlay').innerHTML=`<div class="result-screen">${resultCard(c)}<div class="result-actions"><button class="primary" onclick="nextResult()">${resultIndex===results.length-1?'結果一覧へ':'次のカードへ ▶'}</button><button class="soft" onclick="skipResults()">SKIP ≫</button></div><div class="muted" style="color:white">${resultIndex+1} / ${results.length}</div></div>`}
function skipResults(){let next=results.findIndex((c,i)=>i>=resultIndex&&!c.duplicate&&(phase==='tap'||i>resultIndex||phase!=='card'));if(next<0)return finishPull();resultIndex=next;phase='quote';showResult()}
function nextResult(){resultIndex++;if(resultIndex>=results.length)return finishPull();phase='quote';showResult()}
function finishPull(){el('overlay').innerHTML=`<div class="panel" style="width:92%"><h2>ガチャ結果</h2><div class="result-grid">${results.map(c=>`<div class="item"><div class="pic">${safeSrc(c.image)?`<img src="${safeSrc(c.image)}">`:'✦'}</div><div class="stars">${stars(c.rarity)}</div><b>${esc(c.name)}</b><small>${esc(c.title)}</small><p>${c.duplicate?'チケット +1':'NEW!'}</p></div>`).join('')}</div><p style="text-align:center"><button class="primary" onclick="resetOverlay()">閉じる</button></p></div>`}
function resetOverlay(){el('overlay').innerHTML='<div id="modal" class="panel"></div>';closePanel()}
const oldModal=modal;modal=function(html){if(!el('modal'))resetOverlay();oldModal(html)};
const oldClose=closePanel;closePanel=function(){if(!el('modal'))resetOverlay();else oldClose()};
// Remove direct admin entry from main navigation: management remains behind a password gate.
document.querySelector('.nav button:last-child').textContent='管理';
selectGacha(0);

/* v3 updates */
let collectionSort='obtained',collectionDesc=false,quoteTimer=null,starTimer=null;
function clearRevealTimers(){if(quoteTimer)clearTimeout(quoteTimer);if(starTimer)clearTimeout(starTimer);quoteTimer=starTimer=null}
function getFeatured(g){return Array.isArray(g?.featuredIds)?g.featuredIds:(g?.featured?[g.featured]:[])}
const oldEnsureV2=ensureV2;
ensureV2=function(){oldEnsureV2();for(const g of state.gachas){if(!Array.isArray(g.featuredIds))g.featuredIds=g.featured?[g.featured]:[];if(!g.banner&&g.logo)g.banner=g.logo;if(!g.logo&&g.banner)g.logo=g.banner}};
ensureV2();
selectGacha=function(n){gacha=Math.max(0,Math.min(n,state.gachas.length-1));const g=state.gachas[gacha];renderGachaNav();const evt=document.querySelector('.event');evt.classList.toggle('has-image',!!safeSrc(g.banner||g.logo));document.querySelectorAll('.event-floating-logo').forEach(x=>x.remove());if(safeSrc(g.banner||g.logo)){const img=document.createElement('img');img.className='event-floating-logo';img.src=safeSrc(g.banner||g.logo);img.alt=g.name;document.querySelector('.content').appendChild(img)}el('eventTitle').textContent=safeSrc(g.banner||g.logo)?'ピックアップガチャ':g.name;el('eventInfo').textContent=g.description||'';el('showLabel').textContent='';const ids=getFeatured(g);const c=state.cards.find(x=>ids.includes(x.id))||state.cards[0];el('showArt').innerHTML=artTag(c,'show-art')};
renderGachaNav=function(){const side=document.querySelector('.sidebar');side.innerHTML='<h3>GACHA SELECT</h3>'+state.gachas.map((g,i)=>{const src=safeSrc(g.banner||g.logo);return `<button class="banner ${i===gacha?'active':''}" onclick="selectGacha(${i})" style="${src?`background-image:linear-gradient(#0002,#0006),url('${src}');background-size:cover;background-position:center`:''}">${src?'':esc(g.name)}<small>${getFeatured(g).length?'PICK UP':'NORMAL'}</small></button>`}).join('')};
pickCard=function(r){const pool=state.cards.filter(c=>c.rarity===r);if(!pool.length)return null;const ids=getFeatured(state.gachas[gacha]);const weights=pool.map(c=>ids.includes(c.id)?5:1);let x=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){x-=weights[i];if(x<0)return pool[i]}return pool[0]};
const oldOpenPanel=openPanel;
openPanel=function(which){if(which==='rates'){const g=state.gachas[gacha];return modal(`<h2>提供割合</h2><p>★★ 75% ／ ★★★ 22% ／ ★★★★ 3%</p><p>10連は★★★以上が最低1枚確定。</p><p>ピックアップは同じレアリティ内で各対象カードの抽選重みが5倍。</p><p>対象：${getFeatured(g).map(id=>{const c=state.cards.find(x=>x.id===id);return c?esc(c.name+' / '+c.title):''}).filter(Boolean).join('、')||'なし'}</p>`)}return oldOpenPanel(which)};
renderGachaEditor=function(id=null){editingGacha=id||state.gachas[0]?.id;let g=state.gachas.find(x=>x.id===editingGacha);if(!g){g={id:'new',name:'',description:'',featuredIds:[],logo:'',banner:''};editingGacha='new'}gLogo=g.logo||g.banner||'';gBanner=g.banner||g.logo||'';const ids=getFeatured(g);el('adminBody').innerHTML=`<h3>イベント・ガチャ管理</h3><div class="admin-list">${state.gachas.map(x=>`<button class="soft" onclick="renderGachaEditor('${esc(x.id)}')">${esc(x.name)}</button>`).join('')}<button class="primary" onclick="renderGachaEditor('new')">＋新規ガチャ</button></div><div class="fields"><label>ガチャ名<input id="gName" value="${esc(g.name)}"></label><label>ガチャロゴ兼バナー画像<input type="file" accept="image/*" onchange="setUnifiedGImage(this.files[0])"></label></div><label>説明<input id="gDesc" value="${esc(g.description)}"></label><p class="muted">ピックアップ対象（複数選択可）</p><div class="featured-checks">${state.cards.map(c=>`<label><input type="checkbox" class="feature-check" value="${esc(c.id)}" ${ids.includes(c.id)?'checked':''}>${stars(c.rarity)} ${esc(c.name)} / ${esc(c.title)}</label>`).join('')}</div><p class="muted">ロゴと左バナーには同じ画像を使用。背景透過PNGがおすすめ。</p><div id="logoPrev" class="asset-preview"></div><p><button class="primary" onclick="saveGachaEditor()">ガチャを保存</button> ${editingGacha!=='new'?`<button class="danger" onclick="deleteGacha()">ガチャを削除</button>`:''}</p>`;el('logoPrev').innerHTML=safeSrc(gLogo)?`<img src="${safeSrc(gLogo)}">`:'画像未設定'};
async function setUnifiedGImage(file){try{const img=await readImage(file);gLogo=gBanner=img;el('logoPrev').innerHTML=`<img src="${safeSrc(img)}">`}catch(e){alert(e.message)}}
saveGachaEditor=function(){const name=el('gName').value.trim();if(!name)return alert('ガチャ名を入力してね');let g=state.gachas.find(x=>x.id===editingGacha);if(!g){g={id:'g_'+Date.now()};state.gachas.push(g)}const ids=[...document.querySelectorAll('.feature-check:checked')].map(x=>x.value);Object.assign(g,{name,description:el('gDesc').value,featuredIds:ids,featured:ids[0]||'',logo:gLogo,banner:gLogo});save();selectGacha(state.gachas.findIndex(x=>x.id===g.id));renderAdmin();renderGachaEditor(g.id)};
renderCollection=function(){const ordered=state.cards.map((c,i)=>({...c,_index:i,_obtained:state.history.filter(h=>h.id===c.id&&!h.duplicate).reduce((v,h)=>Math.max(v,h.date),0)}));ordered.sort((a,b)=>{let d=collectionSort==='rarity'?a.rarity-b.rarity:collectionSort==='obtained'?a._obtained-b._obtained:a._index-b._index;return (collectionDesc?-1:1)*d||a._index-b._index});modal(`<h2>カード図鑑　${Object.keys(state.owned).filter(k=>state.owned[k]).length} / ${state.cards.length}</h2><div class="collection-toolbar"><label>並び順 <select onchange="collectionSort=this.value;renderCollection()"><option value="obtained" ${collectionSort==='obtained'?'selected':''}>入手順</option><option value="rarity" ${collectionSort==='rarity'?'selected':''}>レアリティ順</option><option value="registered" ${collectionSort==='registered'?'selected':''}>登録順</option></select></label><button class="soft" onclick="collectionDesc=!collectionDesc;renderCollection()">${collectionDesc?'降順 ↓':'昇順 ↑'}</button></div><div class="items">${ordered.map(c=>`<div class="item collection-card" ${state.owned[c.id]?`onclick="openCardDetail('${esc(c.id)}')"`:''}><div class="pic">${state.owned[c.id]&&safeSrc(c.image)?`<img src="${safeSrc(c.image)}">`:state.owned[c.id]?'✦':'？'}</div><div class="stars">${stars(c.rarity)}</div><b>${state.owned[c.id]?esc(c.name):'未入手'}</b><small>${state.owned[c.id]?esc(c.title):'？？？'}</small></div>`).join('')}</div>`)};
function openCardDetail(id){const c=state.cards.find(x=>x.id===id);if(!c||!state.owned[id])return;el('overlay').innerHTML=`<div class="detail-full">${resultCard(c)}<button class="skip-top" onclick="event.stopPropagation();resetOverlay();renderCollection()">× 閉じる</button></div>`;el('overlay').classList.add('visible')}
function starsAnimated(c){return `<div class="star-sequence">${Array.from({length:c.rarity},(_,i)=>`<span style="--i:${i}">★</span>`).join('')}</div>`}
showSummon=function(){clearRevealTimers();const max=Math.max(2,...results.map(c=>c.rarity));el('overlay').innerHTML=`<div class="summon-screen" onclick="revealSummon()"><button class="skip-corner" onclick="event.stopPropagation();skipResults()">SKIP ≫</button><div class="summon-orb ${max===4?'orb-four':max===3?'orb-three':''}">✦</div><div class="tap-text">TAP TO START</div></div>`;el('overlay').classList.add('visible')};
revealSummon=function(){const max=Math.max(2,...results.map(c=>c.rarity));el('overlay').innerHTML=`<div class="summon-screen special ${max===4?'special-four':max===3?'special-three':'special-two'}" onclick="beginCards()"><button class="skip-corner" onclick="event.stopPropagation();skipResults()">SKIP ≫</button><div class="burst">${max===4?'✦ ✧ ✦':max===3?'✧ ✦ ✧':'✧'}</div><div class="tap-text">TAP TO CONTINUE</div></div>`};
function beginCards(){resultIndex=0;phase='quote';showResult()}
function revealCard(){clearRevealTimers();phase='card';showResult()}
showResult=function(){clearRevealTimers();const c=results[resultIndex];if(!c)return finishPull();if(c.rarity===4&&phase==='quote'){el('overlay').innerHTML=`<div class="result-screen quote-stage" style="cursor:pointer" onclick="revealCard()"><button class="skip-corner" onclick="event.stopPropagation();skipResults()">SKIP ≫</button><div class="quote">${esc(c.quote||'「…………！」')}</div><p style="position:absolute;bottom:5%;opacity:.7">TAP TO SKIP</p></div>`;quoteTimer=setTimeout(()=>{if(phase==='quote')revealCard()},2600);return}phase='card';el('overlay').innerHTML=`<div class="result-screen full-reveal" onclick="nextResult()">${resultCard(c)}${starsAnimated(c)}<button class="skip-corner" onclick="event.stopPropagation();skipResults()">SKIP ≫</button><span style="position:absolute;top:3%;right:3%;color:white;text-shadow:0 2px 4px #333">${resultIndex+1} / ${results.length}</span></div>`};
nextResult=function(){clearRevealTimers();resultIndex++;if(resultIndex>=results.length)return finishPull();phase='quote';showResult()};
skipResults=function(){clearRevealTimers();const from=phase==='card'?resultIndex+1:resultIndex;const next=results.findIndex((c,i)=>i>=from&&!c.duplicate);if(next<0)return finishPull();resultIndex=next;phase='quote';showResult()};
const oldFinishPull=finishPull;finishPull=function(){clearRevealTimers();oldFinishPull()};
selectGacha(gacha);

</script></body></html>
