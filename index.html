<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MAG GACHA — Prototype</title><style>
:root{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;color:#29334d}*{box-sizing:border-box}body{margin:0;background:#070913;overflow:hidden}button,input{font:inherit}button{cursor:pointer;border:0}#screen{position:absolute;width:min(100vw,177.77778vh);height:min(100vh,56.25vw);left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:linear-gradient(135deg,#c8d7ff 0%,#f7e6f2 48%,#b6d8ee 100%)}#screen:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 64% 47%,#fff9 0%,transparent 44%),repeating-linear-gradient(130deg,#ffffff18 0 3px,transparent 3px 40px);pointer-events:none}.top{height:12%;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 2%;background:#ffffffb9;border-bottom:2px solid #ffffff}.logo{font-size:clamp(12px,2.2vw,27px);font-weight:1000;letter-spacing:.12em;color:#5565ad;text-shadow:2px 2px white}.currency{display:flex;align-items:center;gap:8px;background:#fff;border-radius:30px;padding:6px 12px;font-weight:900;font-size:clamp(10px,1.25vw,17px);box-shadow:0 3px 0 #a9b5d2}.gem{color:#29b9d1}.main{height:88%;display:flex;position:relative;padding:1.5% 2%;gap:1.5%}.sidebar{width:23%;display:flex;flex-direction:column;gap:3%;z-index:2}.sidebar h3{margin:0;font-size:clamp(10px,1.35vw,19px);color:#53649c}.banner{height:24%;border:3px solid #fff;border-radius:12px;background:linear-gradient(120deg,#7488cc,#d8a3cc);box-shadow:0 4px 0 #8898b6;position:relative;overflow:hidden;color:white;text-align:left;padding:5% 7%;font-weight:900;font-size:clamp(9px,1.2vw,17px)}.banner:nth-of-type(2){background:linear-gradient(120deg,#6dbaa8,#a5d9e2)}.banner:nth-of-type(3){background:linear-gradient(120deg,#d5a267,#f1d8a8)}.banner.active{outline:3px solid #ffdf75}.banner small{display:block;font-size:.68em;margin-top:5%}.content{flex:1;position:relative;display:flex;flex-direction:column;align-items:stretch}.event{z-index:2;align-self:flex-end;background:#ffffffdf;border:2px solid white;border-radius:12px;padding:1.3% 2%;width:55%;box-shadow:0 4px 12px #7775;font-size:clamp(9px,1.1vw,16px)}.event strong{color:#7656a4;font-size:1.25em}.event p{margin:3px 0}.event button{color:#6170a5;background:transparent;text-decoration:underline;padding:0}.showcase{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}.showcase .art{height:95%;width:70%;border-radius:40% 40% 15% 15%;background:radial-gradient(circle at 50% 34%,#fff9 0 12%,transparent 40%),linear-gradient(145deg,#a6b0ed,#e7b2d8);border:5px solid #ffffff99;box-shadow:0 0 35px #fff8;display:flex;align-items:center;justify-content:center;overflow:hidden}.showcase .art img{width:100%;height:100%;object-fit:contain}.placeholder{text-align:center;color:#fff;text-shadow:0 2px 8px #626b9d;font-weight:900;font-size:clamp(14px,2.5vw,35px)}.placeholder .spark{font-size:2.5em}.showcase .label{position:absolute;bottom:5%;left:6%;color:white;text-shadow:0 3px 8px #555;font-weight:1000;font-size:clamp(12px,2vw,28px)}.actions{display:flex;align-items:center;justify-content:flex-end;gap:2%;height:20%;z-index:2}.pull{height:74%;min-width:23%;padding:0 3%;border-radius:13px;border:3px solid white;color:#485b7c;background:linear-gradient(#fff,#d6e7f6);box-shadow:0 5px 0 #8ea4c0;font-weight:1000;font-size:clamp(11px,1.5vw,21px)}.pull.ten{background:linear-gradient(#ffeab0,#ffbd76);box-shadow:0 5px 0 #c78c6e;color:#795139}.pull small{display:block;font-size:.7em}.nav{display:flex;gap:7px}.nav button{background:#6576ae;color:white;border-radius:10px;padding:8px 14px;font-weight:bold;font-size:clamp(9px,1vw,15px)}.overlay{position:absolute;inset:0;background:#14152bdc;z-index:10;display:none;align-items:center;justify-content:center;padding:3%}.overlay.visible{display:flex}.panel{width:min(85%,850px);max-height:94%;overflow:auto;background:#fffafc;border:4px solid #fff;border-radius:20px;box-shadow:0 12px 50px #0007;padding:2%;position:relative}.panel h2{margin:0 0 1.5%;color:#6771aa;font-size:clamp(16px,2vw,26px)}.close{position:absolute;right:2%;top:2%;border-radius:100%;background:#e8e9f3;color:#59617d;font-weight:900;width:34px;height:34px}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button,.soft{border-radius:10px;background:#e8e9f7;padding:8px 14px;font-weight:800;color:#5d6998}.tabs button.active{background:#7583bb;color:white}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item{background:white;border:2px solid #e7e5f0;border-radius:12px;padding:9px;text-align:center;font-size:clamp(9px,1.05vw,14px)}.item .pic{height:75px;background:linear-gradient(140deg,#c8d3f6,#f2d4e9);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;font-size:30px}.item .pic img{width:100%;height:100%;object-fit:contain}.item b{display:block;margin:5px 0}.item button{background:#ffdb88;color:#6a5475;border-radius:8px;padding:7px;font-weight:bold;width:100%}.item button:disabled{opacity:.4;cursor:default}.stars{color:#e5a845;letter-spacing:2px}.muted{font-size:12px;color:#78809c}.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.shop-card{background:#eef5ff;border-radius:12px;padding:14px;text-align:center}.shop-card strong{font-size:22px;color:#3cabc9}.shop-card button,.primary{background:#ffcc7c;color:#6b4e5a;border:2px solid white;border-radius:12px;padding:10px 20px;font-weight:1000;box-shadow:0 3px 0 #d4a86e}.result-screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center}.result-screen .quote{font-size:clamp(18px,2.5vw,34px);line-height:1.7;text-shadow:0 2px 9px #000;max-width:85%}.result-screen .result-card{width:min(75%,750px);height:70%;border:5px solid #ffdd8e;border-radius:16px;background:linear-gradient(135deg,#9baddb,#e5bad4);position:relative;overflow:hidden;box-shadow:0 0 55px #ffe5a8aa}.result-card img{width:100%;height:100%;object-fit:contain}.result-card .card-footer{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#182039e8);color:white;text-align:left;padding:9% 4% 3%}.result-card .card-footer h2{margin:0;font-size:clamp(17px,2.6vw,36px)}.result-card .card-footer p{margin:3px 0}.result-actions{display:flex;gap:12px;margin-top:12px}.result-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:95%;margin:auto}.result-grid .item{color:#344}.result-grid .pic{height:60px}.admin input,.admin select{width:100%;padding:7px;border:1px solid #b8bed2;border-radius:7px}.admin label{display:block;font-size:12px;font-weight:bold;margin:8px 0}.admin .fields{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}.notice{background:#f1f4ff;border-radius:9px;padding:10px;margin:10px 0;font-size:12px}@media(max-width:650px){.nav button{padding:5px}.panel{width:96%}.item .pic{height:45px}.items{gap:4px}.shop-card{padding:5px}.shop-card strong{font-size:13px}.shop-card button{padding:5px;font-size:10px}.event{width:60%}}
</style></head><body><div id="screen"><header class="top"><div class="logo">✦ MAG GACHA <span style="font-size:.45em;color:#8993b6">PROTOTYPE</span></div><div class="nav"><button onclick="openPanel('collection')">カード図鑑</button><button onclick="openPanel('exchange')">交換所</button><button onclick="openPanel('shop')">ショップ</button><button onclick="openPanel('admin')">カード登録</button></div><div class="currency"><span class="gem">◆</span><span id="balance">0</span></div></header><main class="main"><aside class="sidebar"><h3>GACHA SELECT</h3><button class="banner active" onclick="selectGacha(0)">✦ 星降る夜の約束<small>★★★★ ピックアップ</small></button><button class="banner" onclick="selectGacha(1)">✿ 休日の寄り道<small>★★★ ピックアップ</small></button><button class="banner" onclick="selectGacha(2)">◇ スタンダード<small>いつでも開催</small></button></aside><section class="content"><div class="event"><strong id="eventTitle">星降る夜の約束</strong><p id="eventInfo">★★★★のピックアップ確率UP！</p><button onclick="openPanel('rates')">提供割合・ピックアップ詳細を見る ›</button></div><div class="showcase"><div class="art" id="showArt"><div class="placeholder"><div class="spark">✧ ✦ ✧</div>YOUR CHARACTER<br><span style="font-size:.48em">イラスト登録でここに表示</span></div></div><div class="label" id="showLabel">星降る夜の約束</div></div><div class="actions"><button class="pull" onclick="startPull(1)">1回引く<small>◆ 10</small></button><button class="pull ten" onclick="startPull(10)">10回引く<small>◆ 100 ／ ★★★以上1枚確定</small></button></div></section></main><div id="overlay" class="overlay"><div id="modal" class="panel"></div></div></div><script>
const KEY='mag_gacha_v1';const defaults=[{id:'c01',name:'キャラA',title:'いつもの日常',rarity:2,quote:'',image:''},{id:'c02',name:'キャラB',title:'穏やかな午後',rarity:2,quote:'',image:''},{id:'c03',name:'キャラC',title:'はじめまして',rarity:2,quote:'',image:''},{id:'c04',name:'キャラA',title:'休日のお出かけ',rarity:3,quote:'',image:''},{id:'c05',name:'キャラB',title:'お祭りの夜',rarity:3,quote:'',image:''},{id:'c06',name:'キャラC',title:'特別な衣装',rarity:3,quote:'',image:''},{id:'c07',name:'キャラA',title:'星降る夜の約束',rarity:4,quote:'「やっと、ここまで来られたね。」',image:''},{id:'c08',name:'キャラB',title:'譲れない信念',rarity:4,quote:'「ここから先は、私に任せて。」',image:''},{id:'c09',name:'キャラC',title:'忘れられない景色',rarity:4,quote:'「この瞬間を、ずっと覚えていたい。」',image:''}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};if(!state)state={balance:0,cards:defaults,owned:{},tickets:{2:0,3:0,4:0},history:[]};let gacha=0,tabR=2,results=[],resultIndex=0,phase='';const names=['星降る夜の約束','休日の寄り道','スタンダード'];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存容量が足りない可能性があるぞ。画像を小さくして試してみて！')}};const el=id=>document.getElementById(id);const stars=r=>'★'.repeat(r);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function sync(){el('balance').textContent=state.balance.toLocaleString()}sync();function selectGacha(n){gacha=n;document.querySelectorAll('.banner').forEach((b,i)=>b.classList.toggle('active',i===n));el('eventTitle').textContent=names[n];el('eventInfo').textContent=n===0?'★★★★のピックアップ確率UP！':n===1?'★★★のピックアップ確率UP！':'全カードが対象の常設ガチャ';el('showLabel').textContent=names[n];const card=state.cards.find(c=>c.id===(n===0?'c07':n===1?'c04':'c01'))||state.cards[0];el('showArt').innerHTML=card?.image?`<img src="${card.image}" alt="">`:'<div class="placeholder"><div class="spark">✧ ✦ ✧</div>YOUR CHARACTER<br><span style="font-size:.48em">イラスト登録でここに表示</span></div>'}function modal(html){el('modal').innerHTML=html+'<button class="close" onclick="closePanel()">×</button>';el('overlay').classList.add('visible')}function closePanel(){el('overlay').classList.remove('visible')}function openPanel(which){if(which==='shop')return renderShop();if(which==='collection')return renderCollection();if(which==='exchange')return renderExchange();if(which==='admin')return renderAdmin();if(which==='rates')return modal(`<h2>提供割合</h2><p>★★ 75% ／ ★★★ 22% ／ ★★★★ 3%</p><p>10連は★★★以上が最低1枚確定。</p><p>ピックアップガチャでは同じレアリティ内で対象カードの抽選重みが高くなる。レアリティ全体の排出率は変わらない。</p><p class="notice">現在の対象カード：${esc(gacha===0?'星降る夜の約束':gacha===1?'休日のお出かけ':'全カード')}</p>`)}function renderShop(){modal(`<h2>◆ 通貨ショップ</h2><p>すべて無料！ でも購入の気分は本物。</p><div class="shop-grid">${[10,50,100,1000].map(n=>`<div class="shop-card"><div style="font-size:30px;color:#31b7d1">◆</div><strong>${n.toLocaleString()}個</strong><p class="muted">価格：無料</p><button onclick="buy(${n})">購入する</button></div>`).join('')}</div><p class="notice">所持通貨：◆ ${state.balance.toLocaleString()}　／　1回10個・10回100個</p>`)}function buy(n){if(!confirm(`◆ ${n}個を無料で購入する？`))return;state.balance+=n;save();sync();renderShop();alert(`購入完了！ ◆ ${n}個を受け取った！`)}function pickR(min=2){let rates=min===3?[[3,22],[4,3]]:[[2,75],[3,22],[4,3]];let total=rates.reduce((a,b)=>a+b[1],0),x=Math.random()*total;for(const [r,w] of rates){x-=w;if(x<0)return r}return 4}function pickCard(r){let pool=state.cards.filter(c=>c.rarity===r);if(!pool.length)return null;let weights=pool.map(c=>gacha===0&&c.id==='c07'||gacha===1&&c.id==='c04'?5:1);let x=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){x-=weights[i];if(x<0)return pool[i]}return pool[0]}function startPull(n){if(state.balance<n*10){if(confirm('通貨が足りない！ ショップへ行く？'))renderShop();return}if(!confirm(`${n}回ガチャを引く？ ◆ ${n*10}個消費するぞ。`))return;state.balance-=n*10;results=[];for(let i=0;i<n;i++){let r=pickR(n===10&&i===9?3:2),c=pickCard(r);if(!c){c=state.cards[Math.floor(Math.random()*state.cards.length)]}if(!c)continue;const duplicate=!!state.owned[c.id];if(duplicate)state.tickets[c.rarity]=(state.tickets[c.rarity]||0)+1;else state.owned[c.id]=1;results.push({...c,duplicate});state.history.unshift({id:c.id,date:Date.now(),duplicate})}save();sync();resultIndex=0;phase='quote';showResult()}function resultCard(c){return `<div class="result-card">${c.image?`<img src="${c.image}" alt="">`:'<div class="placeholder" style="padding-top:10%"><div class="spark">✦</div>CHARACTER ART</div>'}<div class="card-footer"><div class="stars">${stars(c.rarity)}</div><p>${esc(c.title)}</p><h2>${esc(c.name)}</h2>${c.duplicate?'<small>重複 → 同レアリティのチケット +1</small>':'<small>NEW!</small>'}</div></div>`}function showResult(){let c=results[resultIndex];if(!c)return;if(c.rarity===4&&phase==='quote'){el('overlay').classList.add('visible');el('modal').outerHTML;el('overlay').innerHTML=`<div class="result-screen"><div class="stars" style="font-size:30px">★★★★</div><div class="quote">${esc(c.quote||'「…………！」')}</div><button class="primary" onclick="phase='card';showResult()">タップして登場 ▶</button></div>`;return}el('overlay').innerHTML=`<div class="result-screen">${resultCard(c)}<div class="result-actions"><button class="primary" onclick="nextResult()">${resultIndex===results.length-1?'結果一覧へ':'次のカードへ ▶'}</button><button class="soft" onclick="finishPull()">スキップ</button></div><div class="muted" style="color:white">${resultIndex+1} / ${results.length}</div></div>`;el('overlay').classList.add('visible')}function nextResult(){resultIndex++;if(resultIndex>=results.length)return finishPull();phase='quote';showResult()}function finishPull(){el('overlay').innerHTML=`<div class="panel" style="width:92%"><h2>ガチャ結果</h2><div class="result-grid">${results.map(c=>`<div class="item"><div class="pic">${c.image?`<img src="${c.image}">`:'✦'}</div><div class="stars">${stars(c.rarity)}</div><b>${esc(c.name)}</b><small>${esc(c.title)}</small><p>${c.duplicate?'チケット +1':'NEW!'}</p></div>`).join('')}</div><p style="text-align:center"><button class="primary" onclick="resetOverlay()">閉じる</button></p></div>`}function resetOverlay(){el('overlay').innerHTML='<div id="modal" class="panel"></div>';closePanel()}function renderCollection(){let owned=state.cards.filter(c=>state.owned[c.id]);modal(`<h2>カード図鑑　${owned.length} / ${state.cards.length}</h2><div class="items">${state.cards.map(c=>`<div class="item"><div class="pic">${state.owned[c.id]&&c.image?`<img src="${c.image}">`:state.owned[c.id]?'✦':'？'}</div><div class="stars">${stars(c.rarity)}</div><b>${state.owned[c.id]?esc(c.name):'未入手'}</b><small>${state.owned[c.id]?esc(c.title):'？？？'}</small></div>`).join('')}</div>`)}function renderExchange(){modal(`<h2>チケット交換所</h2><div class="tabs">${[2,3,4].map(r=>`<button class="${r===tabR?'active':''}" onclick="tabR=${r};renderExchange()">${stars(r)}</button>`).join('')}</div><p>所持 ${stars(tabR)} チケット：<b>${state.tickets[tabR]||0}</b> 枚 ／ 交換に必要：10枚</p><div class="items">${state.cards.filter(c=>c.rarity===tabR).map(c=>`<div class="item"><div class="pic">${c.image?`<img src="${c.image}">`:'✦'}</div><div class="stars">${stars(c.rarity)}</div><b>${esc(c.name)}</b><small>${esc(c.title)}</small><p class="muted">${state.owned[c.id]?'所持済み':'未所持'}</p><button ${state.owned[c.id]||(state.tickets[tabR]||0)<10?'disabled':''} onclick="exchange('${c.id}')">10枚で交換</button></div>`).join('')}</div><p class="muted">通常・イベントを問わず全カードが対象。所持済みカードの再交換はできない。</p>`)}function exchange(id){let c=state.cards.find(c=>c.id===id);if(!c||state.owned[id]||state.tickets[c.rarity]<10)return;if(!confirm(`${c.name}「${c.title}」と交換する？`))return;state.tickets[c.rarity]-=10;state.owned[id]=1;save();renderExchange()}function renderAdmin(){modal(`<div class="admin"><h2>カード登録・編集（試作）</h2><p class="muted">画像はブラウザ内に保存。公開用データはJSONとして書き出せる。画像が大きすぎると保存容量を超える場合があるぞ。</p><div class="fields"><label>キャラクター名<input id="aName" placeholder="例：尾良 己乱"></label><label>カード名<input id="aTitle" placeholder="例：星降る夜の約束"></label><label>レアリティ<select id="aR"><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option></select></label><label>画像（ドラッグ＆ドロップも可）<input id="aImg" type="file" accept="image/*"></label></div><label>登場セリフ<input id="aQuote" placeholder="★★★★の演出で表示"></label><div id="drop" style="padding:15px;border:2px dashed #aab7d4;text-align:center;border-radius:10px">ここに画像をドロップしてもOK</div><p><button class="primary" onclick="addCard()">カードを追加</button> <button class="soft" onclick="exportData()">JSONを書き出す</button> <button class="soft" onclick="el('importFile').click()">JSONを読み込む</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(this.files[0])"></p><p class="notice">登録済み：${state.cards.length}枚。画像を含むデータはこのブラウザ内で保存。別の端末への移動にはJSONの書き出し・読み込みを使ってね。</p></div>`);let drop=el('drop');drop.ondragover=e=>{e.preventDefault();drop.style.background='#dce8ff'};drop.ondragleave=()=>drop.style.background='';drop.ondrop=e=>{e.preventDefault();drop.style.background='';if(e.dataTransfer.files[0]){let dt=new DataTransfer();dt.items.add(e.dataTransfer.files[0]);el('aImg').files=dt.files;drop.textContent=e.dataTransfer.files[0].name}}}async function addCard(){let name=el('aName').value.trim(),title=el('aTitle').value.trim(),rarity=+el('aR').value,quote=el('aQuote').value.trim(),file=el('aImg').files[0];if(!name||!title){alert('キャラ名とカード名を入力してね');return}let image='';if(file){image=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}let id='custom_'+Date.now();state.cards.push({id,name,title,rarity,quote,image});save();selectGacha(gacha);renderAdmin();alert('カードを登録したぞ！')}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mag-gacha-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}async function importData(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.cards)||typeof data.balance!=='number')throw Error();if(!confirm('現在のデータを読み込んだデータで置き換える？'))return;state=data;save();sync();selectGacha(gacha);renderAdmin()}catch{alert('対応するJSONファイルを読み込めなかった')}}
</script></body></html>
